<svg fill="none" viewBox="0 0 1200 300" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 52px; font-weight: 800; letter-spacing: 2px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 600; fill: #94A3B8; letter-spacing: 0.5px; }
    .badge-text { font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 13px; font-weight: 700; fill: #00E5FF; letter-spacing: 1.5px; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #E2E8F0; }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="300" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Cyber Grid Pattern (Subtle) -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="750" y1="0" x2="750" y2="300" />
    <line x1="900" y1="0" x2="900" y2="300" />
    <line x1="1050" y1="0" x2="1050" y2="300" />
  </g>

  <!-- Decorative Circuit Nodes / Hex Accents -->
  <circle cx="1120" cy="50" r="40" fill="#00E5FF" opacity="0.06" filter="url(#glow)" />
  <circle cx="1120" cy="50" r="4" fill="#00E5FF" opacity="0.8" />
  <path d="M 1120 50 L 1060 50 L 1030 80" stroke="#00E5FF" stroke-width="1.5" opacity="0.3" fill="none" />
  
  <circle cx="80" cy="240" r="4" fill="#6366F1" opacity="0.8" />
  <path d="M 80 240 L 140 240 L 170 210" stroke="#6366F1" stroke-width="1.5" opacity="0.3" fill="none" />

  <!-- Top Pill Badge -->
  <g transform="translate(60, 42)">
    <rect width="360" height="30" rx="15" fill="#0F172A" stroke="#00E5FF" stroke-width="1.2" opacity="0.9" />
    <circle cx="16" cy="15" r="4" fill="#10B981" />
    <text x="32" y="20" class="badge-text">AUTONOMOUS SRE • ZERO-TRUST ARCHITECTURE</text>
  </g>

  <!-- Name & Title -->
  <g transform="translate(60, 135)">
    <text class="title" fill="url(#textGrad)">VIVEK KUMAR</text>
  </g>

  <g transform="translate(60, 178)">
    <text class="subtitle">Principal DevSecOps Architect &amp; Agentic AI Systems Lead</text>
  </g>

  <!-- Technology Badges Row -->
  <g transform="translate(60, 222)">
    <!-- Azure CAF -->
    <g transform="translate(0, 0)">
      <rect width="130" height="34" rx="8" fill="#1E293B" stroke="#0284C7" stroke-width="1" />
      <text x="14" y="22" class="tag-text">☁️ Azure CAF</text>
    </g>
    <!-- Terraform IaC -->
    <g transform="translate(142, 0)">
      <rect width="145" height="34" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1" />
      <text x="14" y="22" class="tag-text">🏗️ Terraform IaC</text>
    </g>
    <!-- Kubernetes GitOps -->
    <g transform="translate(299, 0)">
      <rect width="180" height="34" rx="8" fill="#1E293B" stroke="#00E5FF" stroke-width="1" />
      <text x="14" y="22" class="tag-text">☸️ Kubernetes GitOps</text>
    </g>
    <!-- Model Context Protocol -->
    <g transform="translate(491, 0)">
      <rect width="140" height="34" rx="8" fill="#1E293B" stroke="#A855F7" stroke-width="1" />
      <text x="14" y="22" class="tag-text">🤖 Agentic MCP</text>
    </g>
    <!-- Zero-Trust CI/CD -->
    <g transform="translate(643, 0)">
      <rect width="165" height="34" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1" />
      <text x="14" y="22" class="tag-text">🔐 Zero-Trust CI/CD</text>
    </g>
    <!-- FinOps OPEX -->
    <g transform="translate(820, 0)">
      <rect width="150" height="34" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1" />
      <text x="14" y="22" class="tag-text">💰 FinOps -32%</text>
    </g>
  </g>
</svg>
